name: Validate restricted-network guide
on:
  push:
    branches: [validation/restricted-networks-1396]
    paths: [.github/workflows/validate-docs.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adf5f027791b2291ec45b41091e682d16e6fc328
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned Hugo
        working-directory: ${{ runner.temp }}
        run: |
          archive=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" hugo
          echo "$PWD" >> "$GITHUB_PATH"
      - uses: sortie-ai/shared-workflows/.github/actions/setup-lychee@12099056fde09c3b1ef701128316e9fb883eba90
      - name: Build complete site
        run: npm run build
      - name: Check links and anchors
        run: npm run lint:links
      - name: Verify published guide and navigation
        run: |
          test -s public/guides/run-in-restricted-networks/index.html
          grep -q 'run-in-restricted-networks' public/guides/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: restricted-network-guide-render
          path: public/guides/run-in-restricted-networks/
